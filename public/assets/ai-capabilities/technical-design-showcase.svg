    <circle cx="60" cy="-40" r="10" fill="#0a0a0a" stroke="#ff4b4b" stroke-width="2.5"/>
    <circle cx="-60" cy="40" r="10" fill="#0a0a0a" stroke="#ff4b4b" stroke-width="2.5"/>
