      <text x="110" y="30" text-anchor="middle" fill="rgba(255,255,255,.75)" font-size="16" font-weight="700" letter-spacing="1">INSTITUTIONAL</text>
      <text x="110" y="48" text-anchor="middle" fill="rgba(255,255,255,.75)" font-size="16" font-weight="700" letter-spacing="1">KNOWLEDGE</text>
