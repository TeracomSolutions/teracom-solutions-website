    <text x="40" y="196" fill="rgba(255,255,255,.7)" font-size="16">— Institutional knowledge the whole team can reach</text>
    <text x="40" y="232" fill="rgba(255,255,255,.7)" font-size="16">— Less reliance on any one person being available</text>
