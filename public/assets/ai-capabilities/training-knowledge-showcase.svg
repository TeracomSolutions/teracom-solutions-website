    <circle r="108" fill="none" stroke="rgba(255,75,75,.18)" stroke-width="1.5"/>
    <g transform="translate(0,10)" stroke="#ff4b4b" stroke-width="3" fill="none" stroke-linejoin="round">
      <path d="M0,-52 C-34,-68 -70,-60 -70,-60 V44 C-70,44 -34,36 0,52 C34,36 70,44 70,44 V-60 C70,-60 34,-68 0,-52 Z"/>
      <path d="M0,-52 V52" opacity=".6"/>
    </g>
    <text x="0" y="150" text-anchor="middle" fill="rgba(255,255,255,.7)" font-family="Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2">TRAINING &amp; KNOWLEDGE</text>
    <text x="0" y="175" text-anchor="middle" fill="rgba(255,255,255,.35)" font-family="Arial, sans-serif" font-size="14" letter-spacing="1">KNOWLEDGE THE WHOLE TEAM CAN REACH</text>
  </g>

