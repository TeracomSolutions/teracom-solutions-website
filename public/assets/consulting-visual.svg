<svg viewBox="0 0 1200 700" width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#050505"/>

  <!-- blueprint grid, faint -->
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,100 H1200 M0,200 H1200 M0,300 H1200 M0,400 H1200 M0,500 H1200 M0,600 H1200"/>
    <path d="M100,0 V700 M240,0 V700 M380,0 V700 M520,0 V700 M660,0 V700 M800,0 V700 M940,0 V700 M1080,0 V700"/>
  </g>

  <!-- roadmap path connecting milestones -->
  <path d="M140,520 C300,520 300,300 460,300 C620,300 620,180 780,180 C920,180 920,120 1060,120"
        fill="none" stroke="rgba(255,75,75,.5)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <g>
    <circle cx="140" cy="520" r="14" fill="#050505" stroke="#ff4b4b" stroke-width="4"/>
    <circle cx="460" cy="300" r="14" fill="#050505" stroke="#ff4b4b" stroke-width="4"/>
    <circle cx="780" cy="180" r="14" fill="#050505" stroke="#ff4b4b" stroke-width="4"/>
    <circle cx="1060" cy="120" r="16" fill="#ff1717"/>
  </g>

  <!-- milestone cards -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(60,556)">
      <rect width="160" height="70" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
      <rect x="16" y="16" width="90" height="9" rx="4.5" fill="rgba(255,255,255,.35)"/>
      <rect x="16" y="36" width="120" height="8" rx="4" fill="rgba(255,255,255,.18)"/>
    </g>
    <g transform="translate(380,336)">
      <rect width="160" height="70" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
      <rect x="16" y="16" width="90" height="9" rx="4.5" fill="rgba(255,255,255,.35)"/>
      <rect x="16" y="36" width="120" height="8" rx="4" fill="rgba(255,255,255,.18)"/>
    </g>
    <g transform="translate(700,216)">
      <rect width="160" height="70" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
      <rect x="16" y="16" width="90" height="9" rx="4.5" fill="rgba(255,255,255,.35)"/>
      <rect x="16" y="36" width="120" height="8" rx="4" fill="rgba(255,255,255,.18)"/>
    </g>
  </g>

  <!-- document / clipboard motif, right side -->
  <g transform="translate(900,380)">
    <rect width="220" height="270" rx="12" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)"/>
    <rect x="60" y="-14" width="100" height="28" rx="8" fill="#ff1717"/>
    <g fill="rgba(255,255,255,.28)">
      <rect x="28" y="48" width="164" height="10" rx="5"/>
      <rect x="28" y="72" width="130" height="10" rx="5"/>
      <rect x="28" y="96" width="150" height="10" rx="5"/>
    </g>
    <g stroke="#ff4b4b" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M32,140 L46,154 L70,124"/>
      <path d="M32,182 L46,196 L70,166"/>
    </g>
    <g fill="rgba(255,255,255,.24)">
      <rect x="86" y="146" width="106" height="9" rx="4.5"/>
      <rect x="86" y="188" width="106" height="9" rx="4.5"/>
    </g>
    <rect x="28" y="222" width="164" height="30" rx="8" fill="rgba(255,23,23,.15)" stroke="#ff4b4b"/>
  </g>
</svg>
