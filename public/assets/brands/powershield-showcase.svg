<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- rack UPS with battery cells -->
  <g transform="translate(280,160)">
    <rect width="340" height="200" rx="14" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <rect x="24" y="24" width="292" height="60" rx="6" fill="rgba(255,23,23,.08)" stroke="rgba(255,75,75,.3)"/>
    <text x="40" y="60" fill="rgba(255,255,255,.6)" font-family="Arial, sans-serif" font-size="18" font-weight="700">ONLINE DOUBLE-CONVERSION</text>
    <g fill="rgba(255,255,255,.16)">
      <rect x="24" y="100" width="60" height="40" rx="6"/><rect x="94" y="100" width="60" height="40" rx="6"/>
      <rect x="164" y="100" width="60" height="40" rx="6"/><rect x="234" y="100" width="60" height="40" rx="6"/>
    </g>
    <text x="24" y="170" fill="rgba(255,255,255,.35)" font-family="Arial, sans-serif" font-size="13">Hot-swappable battery modules</text>
  </g>

  <g transform="translate(370,420)" font-family="Arial, sans-serif">
    <path d="M60,0 L0,140 L50,140 L20,280 L160,90 L100,90 L130,0 Z" fill="none" stroke="#ff4b4b" stroke-width="3" stroke-linejoin="round"/>
    <text x="80" y="330" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="14">LiFePO₄ battery technology</text>
  </g>

  <!-- Australia map-ish badge -->
  <g transform="translate(660,150)" font-family="Arial, sans-serif">
    <rect width="140" height="60" rx="30" fill="rgba(255,23,23,.12)" stroke="#ff4b4b" stroke-width="2"/>
    <text x="70" y="38" text-anchor="middle" fill="rgba(255,255,255,.75)" font-size="14" font-weight="700">100% AU MADE</text>
  </g>

  <!-- lower stats panel -->
  <g transform="translate(150,830)" font-family="Arial, sans-serif">
    <rect width="600" height="330" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Clean power, for Australian conditions.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">2000</text>
      <text x="250" y="150">5-Year</text>
