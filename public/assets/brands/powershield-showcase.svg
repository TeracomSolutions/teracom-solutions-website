    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">FOUNDED IN</text>
      <text x="250" y="174">LIFEPO4 UPS WARRANTY</text>
    </g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="222">100%</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="246">AUSTRALIAN OWNED &amp; OPERATED</text>
    </g>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,282 H560"/></g>
    <text x="40" y="314" fill="rgba(255,255,255,.5)" font-size="14">Based in Malaga, WA</text>
  </g>
