      <text x="290" y="150">400+</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">YEARS IN ACCESS CONTROL</text>
      <text x="290" y="174">DOORS PER SYSTEM</text>
    </g>
    <g fill="rgba(255,255,255,.85)" font-size="28" font-weight="900">
      <text x="40" y="222">20+</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
