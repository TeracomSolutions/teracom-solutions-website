<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- laptop bag silhouette, flat 180deg opening -->
  <g transform="translate(280,160)">
    <path d="M40,60 Q40,0 100,0 L220,0 Q280,0 280,60 L280,90 L40,90 Z" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="6"/>
    <rect x="0" y="90" width="320" height="380" rx="22" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <rect x="0" y="230" width="320" height="16" fill="rgba(255,23,23,.4)"/>
    <rect x="30" y="130" width="260" height="80" rx="8" fill="rgba(255,23,23,.06)" stroke="rgba(255,75,75,.3)"/>
    <text x="160" y="176" text-anchor="middle" fill="rgba(255,255,255,.35)" font-family="Arial, sans-serif" font-size="13">LAPTOP COMPARTMENT</text>
    <text x="160" y="196" text-anchor="middle" fill="rgba(255,255,255,.35)" font-family="Arial, sans-serif" font-size="12">Opens flat 180°</text>
    <circle cx="270" cy="260" r="22" fill="#0a0a0a" stroke="#ff4b4b" stroke-width="3"/>
    <path d="M262,260 L268,266 L280,250" fill="none" stroke="#ff4b4b" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="30" y="320" width="260" height="10" rx="5" fill="rgba(255,255,255,.16)"/>
    <rect x="30" y="346" width="180" height="9" rx="4.5" fill="rgba(255,255,255,.1)"/>
    <rect x="30" y="400" width="260" height="34" rx="8" fill="rgba(255,23,23,.15)" stroke="#ff4b4b"/>
    <text x="160" y="422" text-anchor="middle" fill="rgba(255,255,255,.7)" font-family="Arial, sans-serif" font-size="13">CHECKPOINT-FRIENDLY</text>
  </g>

  <!-- lower stats panel -->
  <g transform="translate(150,900)" font-family="Arial, sans-serif">
    <rect width="600" height="280" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Built for travel, backed for life.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">20+</text>
      <text x="250" y="150">2M+</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">YEARS IN BUSINESS</text>
      <text x="250" y="174">BAGS SHIPPED</text>
    </g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="222">Lifetime</text>
      <text x="250" y="222">41</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="246">WARRANTY COVERAGE</text>
      <text x="250" y="246">COUNTRIES FIELD-TESTED</text>
    </g>
  </g>
</svg>
