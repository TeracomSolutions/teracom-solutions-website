<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- FSH motif -->
  <g transform="translate(450,380)" font-family="Arial, sans-serif">
    <!-- Door-edge rectangle with electric strike -->
    <rect x="-120" y="-60" width="240" height="120" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="0" y="-30" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="14" font-weight="700">FES20 Series</text>
    
    <!-- Electric strike -->
    <rect x="-30" y="-15" width="60" height="30" rx="4" fill="rgba(255,103,31,.1)" stroke="#ff671f" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#ff671f"/>
    
    <!-- Two-position switch -->
    <g transform="translate(0,50)">
      <rect x="-80" y="-20" width="160" height="40" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <circle cx="-60" cy="0" r="10" fill="#ff671f"/>
      <circle cx="60" cy="0" r="10" fill="#ff9766"/>
      <line x1="-80" y1="0" x2="80" y2="0" stroke="rgba(255,103,31,.35)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
      
      <text x="-60" y="35" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="13">Power-To-Lock</text>
      <text x="60" y="35" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="13">Power-To-Open</text>
    </g>
    
    <!-- Three small rounded tags in a row -->
    <g transform="translate(-60,100)">
      <rect x="0" y="0" width="40" height="20" rx="5" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <text x="20" y="14" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="13">SL8</text>
    </g>
    <g transform="translate(0,100)">
      <rect x="0" y="0" width="40" height="20" rx="5" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <text x="20" y="14" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="13">D8</text>
    </g>
    <g transform="translate(60,100)">
      <rect x="0" y="0" width="40" height="20" rx="5" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <text x="20" y="14" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="13">SCEC</text>
    </g>
  </g>

  <!-- Caption line -->
  <text x="450" y="680" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13" letter-spacing="1">FIELD-INTERCHANGEABLE FAIL-SAFE / FAIL-SECURE</text>

  <!-- lower stats panel -->
  <g transform="translate(150,730)" font-family="Arial, sans-serif">
    <rect width="600" height="400" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">SCEC-approved locking hardware.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    
    <!-- Stats: 2 x 2 grid -->
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">4hr</text>
      <text x="300" y="150">SL8</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">FIRE RATING ON FIRE DOORS</text>
      <text x="300" y="174">SECURITY GRADE</text>
    </g>
    
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="222">D8</text>
      <text x="300" y="222">SCEC</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="246">DURABILITY GRADE</text>
      <text x="300" y="246">APPROVED (FES20M)</text>
    </g>
    
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,282 H560"/></g>
    
    <text x="40" y="316" fill="rgba(255,255,255,.5)" font-size="14">Strikes, maglocks, drop bolts, mortice locks</text>
    <text x="40" y="346" fill="rgba(255,255,255,.5)" font-size="14">An Allegion brand for Australia</text>
  </g>
</svg>