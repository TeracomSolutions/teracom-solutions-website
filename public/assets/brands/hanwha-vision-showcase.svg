<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- timeline motif -->
  <g transform="translate(450,385)" font-family="Arial, sans-serif">
    <!-- horizontal dashed line -->
    <line x1="-300" y1="0" x2="300" y2="0" stroke="rgba(243,115,33,.35)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    
    <!-- timeline dots -->
    <circle cx="-230" cy="0" r="7" fill="#f37321"/>
    <text x="-230" y="30" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">1977 -- Samsung Techwin</text>
    
    <circle cx="0" cy="0" r="7" fill="#f37321"/>
    <text x="0" y="30" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">2014 -- Hanwha Techwin</text>
    
    <circle cx="230" cy="0" r="10" fill="#f89b6c"/>
    <text x="230" y="30" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">2023 -- Hanwha Vision</text>
  </g>

  <!-- camera types boxes -->
  <g transform="translate(450,520)" font-family="Arial, sans-serif">
    <!-- Fixed box -->
    <g transform="translate(-170,-30)">
      <rect width="80" height="60" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <circle cx="40" cy="30" r="16" fill="#f37321" stroke="#f37321" stroke-width="2"/>
      <text x="40" y="75" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Fixed</text>
    </g>
    
    <!-- PTZ box -->
    <g transform="translate(-60,-30)">
      <rect width="80" height="60" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <circle cx="40" cy="30" r="16" fill="#f37321" stroke="#f37321" stroke-width="2"/>
      <text x="40" y="75" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">PTZ</text>
    </g>
    
    <!-- Multi-sensor box -->
    <g transform="translate(50,-30)">
      <rect width="80" height="60" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <circle cx="40" cy="30" r="16" fill="#f37321" stroke="#f37321" stroke-width="2"/>
      <text x="40" y="75" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Multi-sensor</text>
    </g>
    
    <!-- Thermal box -->
    <g transform="translate(160,-30)">
      <rect width="80" height="60" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <circle cx="40" cy="30" r="16" fill="#f37321" stroke="#f37321" stroke-width="2"/>
      <text x="40" y="75" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Thermal</text>
    </g>
  </g>

  <!-- caption line -->
  <text x="450" y="680" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13" letter-spacing="1">IN-HOUSE CHIP AND SENSOR ENGINEERING</text>

  <!-- lower stats panel -->
  <g transform="translate(150,730)" font-family="Arial, sans-serif">
    <rect width="600" height="320" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Korean camera engineering.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    
    <!-- first row of stats -->
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">1977</text>
      <text x="290" y="150">2023</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">SAMSUNG TECHWIN ORIGINS</text>
      <text x="290" y="174">HANWHA VISION IDENTITY</text>
    </g>
    
    <!-- second divider -->
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,210 H560"/></g>
    
    <!-- footer lines -->
    <text x="40" y="244" fill="rgba(255,255,255,.5)" font-size="14">On-camera object and perimeter analytics</text>
    <text x="40" y="274" fill="rgba(255,255,255,.5)" font-size="14">Cloud-connected and thermal product lines</text>
  </g>
</svg>