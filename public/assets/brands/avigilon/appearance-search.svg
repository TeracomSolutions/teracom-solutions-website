<svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" role="img" aria-label="Appearance Search: a description finds the same person on several cameras and marks each sighting on a timeline">
  <defs>
    <linearGradient id="as-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a30"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <filter id="as-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#as-bg)"/>

  <!-- the search -->
  <g transform="translate(32 28)">
    <rect width="536" height="44" rx="22" fill="#0e1b2e" stroke="#2c4c78"/>
    <circle cx="26" cy="22" r="9" fill="none" stroke="#00b2ff" stroke-width="2.5"/>
    <path d="M33 29 L40 36" stroke="#00b2ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="27" font-size="14" fill="#e8f1ff">Blue jacket · dark pants · backpack</text>
    <rect x="428" y="9" width="96" height="26" rx="13" fill="#00b2ff"/>
    <text x="476" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#001326">4 cameras</text>
  </g>

  <!-- results from four cameras -->
  <g font-size="11">
    <g transform="translate(32 96)">
      <rect width="122" height="150" rx="12" fill="#0e1b2e" stroke="#2c4c78"/>
      <circle cx="61" cy="52" r="14" fill="#c9d6e8"/>
      <rect x="44" y="68" width="34" height="58" rx="12" fill="#2f7fff"/>
      <text x="12" y="142" fill="#7f93ad">Cam 03 · 14:02</text>
      <rect x="10" y="10" width="44" height="18" rx="9" fill="#123e6e"/>
      <text x="32" y="23" text-anchor="middle" fill="#cfe7ff">71%</text>
    </g>
    <g transform="translate(170 96)">
      <rect width="122" height="150" rx="12" fill="#0e1b2e" stroke="#00b2ff" stroke-width="2.5" filter="url(#as-glow)"/>
      <circle cx="61" cy="52" r="14" fill="#c9d6e8"/>
      <rect x="44" y="68" width="34" height="58" rx="12" fill="#2f7fff"/>
      <rect x="76" y="78" width="11" height="24" rx="4" fill="#1b3c74"/>
      <text x="12" y="142" fill="#e8f1ff">Cam 07 · 14:06</text>
      <rect x="10" y="10" width="44" height="18" rx="9" fill="#00b2ff"/>
      <text x="32" y="23" text-anchor="middle" font-weight="700" fill="#001326">96%</text>
    </g>
    <g transform="translate(308 96)">
      <rect width="122" height="150" rx="12" fill="#0e1b2e" stroke="#2c4c78"/>
      <circle cx="61" cy="52" r="14" fill="#c9d6e8"/>
      <rect x="44" y="68" width="34" height="58" rx="12" fill="#2f7fff"/>
      <rect x="76" y="78" width="11" height="24" rx="4" fill="#1b3c74"/>
      <text x="12" y="142" fill="#7f93ad">Cam 12 · 14:11</text>
      <rect x="10" y="10" width="44" height="18" rx="9" fill="#123e6e"/>
      <text x="32" y="23" text-anchor="middle" fill="#cfe7ff">91%</text>
    </g>
    <g transform="translate(446 96)">
      <rect width="122" height="150" rx="12" fill="#0e1b2e" stroke="#2c4c78"/>
      <circle cx="61" cy="52" r="14" fill="#c9d6e8"/>
      <rect x="44" y="68" width="34" height="58" rx="12" fill="#4a5a70"/>
      <text x="12" y="142" fill="#7f93ad">Cam 15 · 14:19</text>
      <rect x="10" y="10" width="44" height="18" rx="9" fill="#123e6e"/>
      <text x="32" y="23" text-anchor="middle" fill="#cfe7ff">48%</text>
    </g>
  </g>

  <!-- the timeline of sightings -->
  <g transform="translate(32 278)">
    <rect width="536" height="6" rx="3" fill="#1a2a42"/>
    <rect x="96" width="250" height="6" rx="3" fill="#00b2ff" opacity="0.5"/>
    <circle cx="96" cy="3" r="7" fill="#00b2ff"/>
    <circle cx="170" cy="3" r="9" fill="#00b2ff" filter="url(#as-glow)"/>
    <circle cx="262" cy="3" r="7" fill="#00b2ff"/>
    <circle cx="346" cy="3" r="6" fill="#4a6a90"/>
    <text x="0" y="34" font-size="11" fill="#7f93ad">14:00</text>
    <text x="536" y="34" text-anchor="end" font-size="11" fill="#7f93ad">14:30</text>
    <text x="268" y="34" text-anchor="middle" font-size="12" fill="#e8f1ff">Route across the site in 19 minutes</text>
  </g>
</svg>