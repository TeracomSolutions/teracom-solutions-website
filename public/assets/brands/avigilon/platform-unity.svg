<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" role="img" aria-label="Avigilon Unity: cameras, doors and alarms on site report to a server room you own, with optional cloud services on top">
  <defs>
    <linearGradient id="un-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a30"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="url(#un-bg)"/>

  <!-- the building outline -->
  <rect x="24" y="40" width="552" height="256" rx="18" fill="none" stroke="#2c4c78" stroke-dasharray="6 6"/>
  <rect x="40" y="28" width="108" height="24" rx="12" fill="#0b1a30" stroke="#2c4c78"/>
  <text x="94" y="45" text-anchor="middle" font-size="11" fill="#7f93ad">Your site</text>

  <!-- the server rack -->
  <g transform="translate(250 82)">
    <rect width="100" height="172" rx="10" fill="#0e1b2e" stroke="#3a5a86" stroke-width="2"/>
    <g fill="#132238" stroke="#3a5a86">
      <rect x="12" y="14" width="76" height="30" rx="4"/>
      <rect x="12" y="52" width="76" height="30" rx="4"/>
      <rect x="12" y="90" width="76" height="30" rx="4"/>
      <rect x="12" y="128" width="76" height="30" rx="4"/>
    </g>
    <g fill="#3ecf8e">
      <circle cx="76" cy="29" r="3.5"/><circle cx="76" cy="67" r="3.5"/><circle cx="76" cy="105" r="3.5"/><circle cx="76" cy="143" r="3.5"/>
    </g>
    <g stroke="#00b2ff" stroke-width="3" stroke-linecap="round">
      <path d="M22 29 H54 M22 67 H48 M22 105 H58 M22 143 H44"/>
    </g>
  </g>
  <text x="300" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#e8f1ff">Unity server</text>

  <!-- devices on the left -->
  <g fill="none" stroke="#00b2ff" stroke-opacity="0.6" stroke-width="2">
    <path d="M118 104 H250 M118 168 H250 M118 232 H250"/>
  </g>
  <g font-size="11" fill="#e8f1ff">
    <g transform="translate(48 84)">
      <rect width="70" height="40" rx="10" fill="#0e1b2e" stroke="#2c4c78"/>
      <circle cx="22" cy="20" r="10" fill="#132238" stroke="#00b2ff" stroke-width="2"/>
      <circle cx="22" cy="20" r="3.5" fill="#00b2ff"/>
      <text x="38" y="24">Video</text>
    </g>
    <g transform="translate(48 148)">
      <rect width="70" height="40" rx="10" fill="#0e1b2e" stroke="#2c4c78"/>
      <rect x="14" y="10" width="14" height="20" rx="3" fill="#132238" stroke="#00b2ff" stroke-width="2"/>
      <text x="36" y="24">Doors</text>
    </g>
    <g transform="translate(48 212)">
      <rect width="70" height="40" rx="10" fill="#0e1b2e" stroke="#2c4c78"/>
      <path d="M16 28 L22 12 L28 28 Z" fill="none" stroke="#ffb020" stroke-width="2"/>
      <text x="36" y="24">Alarms</text>
    </g>
  </g>

  <!-- workstation and the optional cloud services -->
  <path d="M350 168 H440" stroke="#00b2ff" stroke-opacity="0.6" stroke-width="2"/>
  <g transform="translate(440 128)">
    <rect width="112" height="70" rx="8" fill="#0e1b2e" stroke="#3a5a86" stroke-width="2"/>
    <rect x="10" y="10" width="92" height="44" rx="4" fill="#0a2240"/>
    <path d="M18 44 L34 30 L48 38 L66 20 L94 34" fill="none" stroke="#00b2ff" stroke-width="2"/>
    <rect x="44" y="70" width="24" height="12" fill="#3a5a86"/>
    <text x="56" y="104" text-anchor="middle" font-size="11" fill="#7f93ad">Security desk</text>
  </g>
  <path d="M300 82 V58 H436 V46" fill="none" stroke="#7f93ad" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 6"/>
  <g transform="translate(400 6)">
    <path d="M14 40 a12 12 0 0 1 2 -24 a17 17 0 0 1 32 -5 a14 14 0 0 1 12 27 z" fill="#0e1b2e" stroke="#7f93ad"/>
    <text x="72" y="32" font-size="11" fill="#7f93ad">Cloud services</text>
  </g>
</svg>