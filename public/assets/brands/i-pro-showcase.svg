<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- i-PRO camera motif -->
  <g transform="translate(450,380)" font-family="Arial, sans-serif">
    <!-- Bullet camera outline -->
    <circle cx="0" cy="0" r="120" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <!-- Camera body chip -->
    <rect x="-40" y="-40" width="80" height="80" rx="8" fill="rgba(100,100,230,.1)" stroke="#6464e6" stroke-width="2"/>
    <!-- AI label inside chip -->
    <text x="0" y="5" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13" font-weight="800">AI</text>
    <!-- Analytics on camera label -->
    <text x="0" y="-140" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Analytics on the camera</text>
  </g>

  <!-- Server box with diagonal line -->
  <g transform="translate(670,350)" font-family="Arial, sans-serif">
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <!-- Diagonal line through server -->
    <line x1="-60" y1="-40" x2="60" y2="40" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <!-- No analytics server label -->
    <text x="0" y="100" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="13">No analytics server</text>
  </g>

  <!-- Connectors -->
  <g stroke="rgba(100,100,230,.35)" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.7" stroke-linecap="round">
    <path d="M566,350 L610,350"/>
  </g>

  <!-- Caption line -->
  <text x="450" y="680" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13" letter-spacing="1">ANALYTICS ON THE EDGE</text>

  <!-- lower stats panel -->
  <g transform="translate(150,730)" font-family="Arial, sans-serif">
    <rect width="600" height="320" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Edge AI, Panasonic heritage.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">2019</text>
      <text x="290" y="150">2022</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">SPUN OUT OF PANASONIC</text>
      <text x="290" y="174">REBRANDED AS i-PRO</text>
    </g>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,210 H560"/></g>
    <text x="40" y="244" fill="rgba(255,255,255,.5)" font-size="14">Suits data-sovereignty and privacy requirements</text>
    <text x="40" y="274" fill="rgba(255,255,255,.5)" font-size="14">Industrial-grade build for harsh sites</text>
  </g>
</svg>