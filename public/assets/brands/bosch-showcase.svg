<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- top illustration area -->
  <g font-family="Arial, sans-serif">
    <!-- Three columns with icons -->
    <g transform="translate(150,200)">
      <rect x="0" y="0" width="180" height="300" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <circle cx="90" cy="100" r="40" fill="none" stroke="#ed0007" stroke-width="3"/>
      <text x="90" y="220" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="15">Video</text>
    </g>
    
    <g transform="translate(360,200)">
      <rect x="0" y="0" width="180" height="300" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <rect x="50" y="70" width="80" height="160" rx="4" fill="none" stroke="#ed0007" stroke-width="3"/>
      <text x="90" y="220" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="15">Access</text>
    </g>
    
    <g transform="translate(570,200)">
      <rect x="0" y="0" width="180" height="300" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <polygon points="90,60 130,140 50,140" fill="none" stroke="#ed0007" stroke-width="3"/>
      <text x="90" y="220" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="15">Intrusion</text>
    </g>
    
    <!-- Timeline with dots -->
    <g transform="translate(150,540)" stroke="#ed0007" stroke-width="3" fill="none">
      <path d="M0,0 H600" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.7"/>
      <circle cx="0" cy="0" r="10" fill="#ed0007"/>
      <circle cx="300" cy="0" r="10" fill="#ff353b"/>
      <circle cx="600" cy="0" r="10" fill="#ed0007"/>
    </g>
    
    <!-- Timeline labels -->
    <text x="150" y="580" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Bosch Building Technologies</text>
    <text x="450" y="580" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Dec 2024 -- Keenfinity Group</text>
    <text x="750" y="580" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Radionix + IQSIGHT</text>
  </g>

  <!-- caption line -->
  <text x="450" y="680" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13" letter-spacing="1">SAME PRODUCTS, ENGINEERING AND SUPPORT</text>

  <!-- lower stats panel -->
  <g transform="translate(150,730)" font-family="Arial, sans-serif">
    <rect width="600" height="320" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Bosch security, now Keenfinity.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    
    <!-- Stats values and labels -->
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">2024</text>
      <text x="290" y="150">3</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">KEENFINITY GROUP FORMED</text>
      <text x="290" y="174">VIDEO, ACCESS, INTRUSION</text>
    </g>
    
    
    <!-- Footer lines -->
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,210 H560"/></g>
    <text x="40" y="244" fill="rgba(255,255,255,.5)" font-size="14">Radionix intrusion panels + IQSIGHT video</text>
    <text x="40" y="274" fill="rgba(255,255,255,.5)" font-size="14">Existing Bosch installs fully supportable</text>
  </g>
</svg>