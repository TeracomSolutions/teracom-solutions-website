<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- panel with dual wireless paths (legacy + encrypted) -->
  <g transform="translate(320,170)">
    <rect width="260" height="300" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="130" y="46" text-anchor="middle" fill="rgba(255,255,255,.7)" font-family="Arial, sans-serif" font-size="18" font-weight="800">XR PRO</text>
    <rect x="24" y="70" width="212" height="70" rx="8" fill="rgba(255,23,23,.08)" stroke="rgba(255,75,75,.3)"/>
    <text x="130" y="112" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13">UltraSync IP + 4G</text>
    <g fill="rgba(255,255,255,.16)">
      <rect x="24" y="160" width="100" height="34" rx="6"/>
      <rect x="136" y="160" width="100" height="34" rx="6"/>
    </g>
    <text x="74" y="182" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="11">60-bit legacy</text>
    <text x="186" y="182" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="11">80Plus encrypted</text>
    <rect x="24" y="230" width="212" height="34" rx="8" fill="rgba(255,23,23,.15)" stroke="#ff4b4b"/>
    <text x="130" y="252" text-anchor="middle" fill="rgba(255,255,255,.7)" font-family="Arial, sans-serif" font-size="13">16 TO 176 ZONES</text>
  </g>

  <g stroke="#ff4b4b" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.6">
    <circle cx="450" cy="320" r="220"/>
  </g>

  <!-- lower panel, no numeric stats (none published), feature summary instead -->
  <g transform="translate(150,760)" font-family="Arial, sans-serif">
    <rect width="600" height="320" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Built to protect your existing investment.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    <text x="40" y="130" fill="rgba(255,255,255,.5)" font-size="14">4-wire XR bus + legacy 3-wire NX/Reliance bus</text>
    <text x="40" y="164" fill="rgba(255,255,255,.5)" font-size="14">Native IP camera support + Z-Wave automation</text>
    <text x="40" y="198" fill="rgba(255,255,255,.5)" font-size="14">NBN-ready, dual-SIM 4G/Wi-Fi option</text>
    <text x="40" y="232" fill="rgba(255,255,255,.5)" font-size="14">Field-upgradeable firmware</text>
    <rect x="40" y="260" width="300" height="34" rx="8" fill="rgba(255,23,23,.15)" stroke="#ff4b4b"/>
    <text x="190" y="282" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="13">UPGRADE, NOT RIP-AND-REPLACE</text>
  </g>
</svg>
