    <!-- Footer lines -->
    <text x="40" y="244" fill="rgba(255,255,255,.5)" font-size="14">Appearance search, LPR, facial matching</text>
    <text x="40" y="274" fill="rgba(255,255,255,.5)" font-size="14">Integrates with Motorola radio and dispatch</text>
