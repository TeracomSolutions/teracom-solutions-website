<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- ASSA ABLOY motif -->
  <g font-family="Arial, sans-serif">
    <!-- Top-left box -->
    <rect x="150" y="150" width="140" height="60" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="220" y="180" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">ASSA -- Sweden</text>
    
    <!-- Top-right box -->
    <rect x="610" y="150" width="140" height="60" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="680" y="180" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Abloy -- Finland</text>
    
    <!-- Central box -->
    <rect x="380" y="270" width="140" height="60" rx="8" fill="rgba(34,90,221,.1)" stroke="#225add" stroke-width="2"/>
    <text x="450" y="300" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">ASSA ABLOY</text>
    <text x="450" y="320" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="13">1994</text>
    
    <!-- Dashed lines from top boxes to central box -->
    <g stroke="rgba(34,90,221,.35)" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.7" stroke-linecap="round">
      <path d="M220,210 L450,300"/>
      <path d="M680,210 L450,300"/>
    </g>
    
    <!-- Bottom boxes -->
    <rect x="150" y="400" width="100" height="50" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="200" y="430" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Lockwood</text>
    
    <rect x="270" y="400" width="100" height="50" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="320" y="430" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Trimec</text>
    
    <rect x="390" y="400" width="100" height="50" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="440" y="430" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Aperio</text>
    
    <rect x="510" y="400" width="100" height="50" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="560" y="430" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">SMARTair</text>
    
    <rect x="630" y="400" width="100" height="50" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="680" y="430" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Incedo</text>
    
    <!-- Dashed lines from central box to bottom boxes -->
    <g stroke="rgba(34,90,221,.35)" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.7" stroke-linecap="round">
      <path d="M450,330 L200,400"/>
      <path d="M450,330 L320,400"/>
      <path d="M450,330 L440,400"/>
      <path d="M450,330 L560,400"/>
      <path d="M450,330 L680,400"/>
    </g>
    
    <!-- Dots at connection points -->
    <circle cx="220" cy="210" r="3" fill="#225add"/>
    <circle cx="680" cy="210" r="3" fill="#225add"/>
    <circle cx="450" cy="330" r="3" fill="#225add"/>
    <circle cx="200" cy="400" r="3" fill="#6088e7"/>
    <circle cx="320" cy="400" r="3" fill="#6088e7"/>
    <circle cx="440" cy="400" r="3" fill="#6088e7"/>
    <circle cx="560" cy="400" r="3" fill="#6088e7"/>
    <circle cx="680" cy="400" r="3" fill="#6088e7"/>
  </g>

  <!-- Caption line -->
  <text x="450" y="680" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13" letter-spacing="1">MECHANICAL + ELECTRONIC ACCESS -- ONE SOURCE</text>

  <!-- lower stats panel -->
  <g transform="translate(150,730)" font-family="Arial, sans-serif">
    <rect width="600" height="400" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">The world's largest lock group.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">1994</text>
      <text x="290" y="150">200+</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">FORMED BY MERGER</text>
      <text x="290" y="174">MANUFACTURING SITES</text>
    </g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="222">100+</text>
      <text x="290" y="222">3</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="246">COUNTRIES</text>
      <text x="290" y="246">ELECTRONIC ACCESS PLATFORMS</text>
    </g>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,282 H560"/></g>
    <text x="40" y="316" fill="rgba(255,255,255,.5)" font-size="14">Aperio wireless locking -- no wiring retrofit</text>
    <text x="40" y="346" fill="rgba(255,255,255,.5)" font-size="14">Parent of Lockwood and Trimec in Australia</text>
  </g>
</svg>