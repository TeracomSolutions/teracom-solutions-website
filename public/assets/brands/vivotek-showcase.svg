<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- fisheye lens motif -->
  <g transform="translate(450,385)" font-family="Arial, sans-serif">
    <!-- outer ring (360° circle) -->
    <circle cx="0" cy="0" r="120" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="0" y="-130" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="15">360°</text>
    
    <!-- lens body -->
    <circle cx="0" cy="0" r="60" fill="rgba(24,119,255,.1)" stroke="#1877ff" stroke-width="3"/>
    
    <!-- center dot -->
    <circle cx="0" cy="0" r="8" fill="#5fa1ff"/>
    
    <!-- 180° arc (half circle) -->
    <path d="M-120,0 A120,120 0 0,1 120,0" fill="none" stroke="rgba(24,119,255,.35)" stroke-width="2" stroke-dasharray="2 8"/>
    <text x="0" y="-130" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="15">180°</text>
    
    <!-- radiating lines for coverage -->
    <line x1="0" y1="0" x2="-100" y2="-60" stroke="rgba(24,119,255,.35)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="100" y2="-60" stroke="rgba(24,119,255,.35)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-60" y2="100" stroke="rgba(24,119,255,.35)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="60" y2="100" stroke="rgba(24,119,255,.35)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-100" y2="60" stroke="rgba(24,119,255,.35)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="100" y2="60" stroke="rgba(24,119,255,.35)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  </g>

  <text x="450" y="680" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13" letter-spacing="1">180° / 360° SINGLE-LENS COVERAGE</text>

  <!-- lower stats panel -->
  <g transform="translate(150,730)" font-family="Arial, sans-serif">
    <rect width="600" height="400" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Panoramic optics from Taiwan.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">2000</text>
      <text x="290" y="150">360°</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">IP CAMERAS SINCE</text>
      <text x="290" y="174">SINGLE-LENS COVERAGE</text>
    </g>
    
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="222">2017</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="246">JOINED DELTA ELECTRONICS</text>
    </g>
    
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,282 H560"/></g>
    
    <text x="40" y="316" fill="rgba(255,255,255,.5)" font-size="14">Car parks, retail floors, open-plan offices</text>
    <text x="40" y="346" fill="rgba(255,255,255,.5)" font-size="14">A Delta Electronics company</text>
  </g>
</svg>