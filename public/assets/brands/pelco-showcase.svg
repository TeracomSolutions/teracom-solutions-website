<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)`" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- top illustration area with three camera types and central hub -->
  <g font-family="Arial, sans-serif">
    <!-- Fixed camera icon -->
    <g transform="translate(200,250)">
      <rect x="-40" y="-20" width="80" height="40" rx="4" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <rect x="-30" y="-10" width="60" height="20" rx="2" fill="none" stroke="#2e5ac2" stroke-width="2"/>
      <text x="0" y="45" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Fixed</text>
    </g>

    <!-- PTZ camera icon -->
    <g transform="translate(450,250)">
      <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#0a0a0a" stroke="#2e5ac2" stroke-width="3"/>
      <circle cx="0" cy="0" r="3" fill="#3277ff"/>
      <text x="0" y="45" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">PTZ</text>
    </g>

    <!-- Panoramic camera icon -->
    <g transform="translate(700,250)">
      <rect x="-40" y="-20" width="80" height="40" rx="4" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <rect x="-30" y="-10" width="60" height="20" rx="4" fill="#0a0a0a" stroke="#2e5ac2" stroke-width="2"/>
      <text x="0" y="45" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Panoramic</text>
    </g>

    <!-- Central hub with dashed lines to all cameras -->
    <g transform="translate(450,430)">
      <circle cx="0" cy="0" r="62" fill="rgba(46,90,194,.1)" stroke="#2e5ac2" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Open platform</text>
    </g>

    <!-- Dashed lines from cameras to central hub -->
    <g stroke="#2e5ac2" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.7" stroke-linecap="round">
      <path d="M200,308 L405,388"/>
      <path d="M450,308 L450,368"/>
      <path d="M700,308 L495,388"/>
    </g>

    <!-- Lines from central hub to third-party VMS and Access control -->
    <g stroke="#2e5ac2" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.7" stroke-linecap="round">
      <path d="M405,472 L320,540"/>
      <path d="M495,472 L580,540"/>
    </g>

    <!-- Third-party VMS box -->
    <g transform="translate(280,560)">
      <rect x="-80" y="-20" width="160" height="40" rx="4" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Third-party VMS</text>
    </g>

    <!-- Access control box -->
    <g transform="translate(620,560)">
      <rect x="-80" y="-20" width="160" height="40" rx="4" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="rgba(255,255,255,.8)" font-size="13">Access control</text>
    </g>
  </g>

  <!-- Caption text -->
  <text x="450" y="680" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13" letter-spacing="1">OPEN PLATFORM -- BUILT TO INTEGRATE</text>

  <!-- lower stats panel -->
  <g transform="translate(150,730)" font-family="Arial, sans-serif">
    <rect width="600" height="320" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Open-platform CCTV since 1957.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">1957</text>
      <text x="290" y="150">2020</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">FOUNDED IN FRESNO, CA</text>
      <text x="290" y="174">JOINED MOTOROLA SOLUTIONS</text>
    </g>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,210 H560"/></g>
    <text x="40" y="244" fill="rgba(255,255,255,.5)" font-size="14">Fixed, PTZ and panoramic cameras</text>
    <text x="40" y="274" fill="rgba(255,255,255,.5)" font-size="14">Onboard perimeter and object analytics</text>
  </g>
</svg>