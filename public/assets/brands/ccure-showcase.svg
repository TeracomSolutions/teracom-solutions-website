<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- C•CURE 9000 server with iSTAR boxes and network circle -->
  <g font-family="Arial, sans-serif">
    <!-- Central C•CURE 9000 server box -->
    <rect x="350" y="180" width="200" height="100" rx="16" fill="rgba(22,55,233,.1)" stroke="#1637e9" stroke-width="2"/>
    <text x="450" y="230" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="15" font-weight="800">C•CURE 9000</text>
    
    <!-- iSTAR boxes in a row -->
    <rect x="250" y="340" width="100" height="60" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="300" y="375" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="13">iSTAR</text>
    
    <rect x="400" y="340" width="100" height="60" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="450" y="375" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="13">iSTAR</text>
    
    <rect x="550" y="340" width="100" height="60" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="600" y="375" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="13">iSTAR</text>
    
    <!-- Door readers (small dots) under each iSTAR -->
    <circle cx="300" cy="420" r="6" fill="#1637e9"/>
    <circle cx="450" cy="420" r="6" fill="#1637e9"/>
    <circle cx="600" cy="420" r="6" fill="#576fef"/>
    
    <!-- Dashed lines from C•CURE 9000 to iSTAR boxes -->
    <g stroke="rgba(22,55,233,.35)" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.7">
      <path d="M450,280 L300,340"/>
      <path d="M450,280 L450,340"/>
      <path d="M450,280 L600,340"/>
    </g>
    
    <!-- Large dashed circle network -->
    <circle cx="450" cy="350" r="180" fill="none" stroke="rgba(22,55,233,.35)" stroke-width="2" stroke-dasharray="2 8"/>
    <text x="450" y="545" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="13">Multi-server network</text>
  </g>

  <!-- Caption line -->
  <text x="450" y="680" text-anchor="middle" fill="rgba(255,255,255,.4)" font-family="Arial, sans-serif" font-size="13" letter-spacing="1">SINGLE SITE TO GLOBAL, MULTI-SERVER</text>

  <!-- lower stats panel -->
  <g transform="translate(150,730)" font-family="Arial, sans-serif">
    <rect width="600" height="320" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Scales from one site to global.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
      <text x="40" y="150">300+</text>
      <text x="290" y="150">1,000s</text>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="13" letter-spacing=".04em">
      <text x="40" y="174">TECHNOLOGY PARTNERS</text>
      <text x="290" y="174">OF READERS SUPPORTED</text>
    </g>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,210 H560"/></g>
    <text x="40" y="244" fill="rgba(255,255,255,.5)" font-size="14">C•CURE IQ web management + C•CURE Go mobile</text>
    <text x="40" y="274" fill="rgba(255,255,255,.5)" font-size="14">Software House, a Johnson Controls brand</text>
  </g>
</svg>