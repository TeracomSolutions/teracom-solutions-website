<svg viewBox="0 0 900 1300" width="900" height="1300" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="1300" fill="#050505"/>
  <g stroke="rgba(255,255,255,.045)" stroke-width="1">
    <path d="M0,140 H900 M0,280 H900 M0,420 H900 M0,560 H900 M0,700 H900 M0,840 H900 M0,980 H900 M0,1120 H900"/>
    <path d="M120,0 V1300 M300,0 V1300 M480,0 V1300 M660,0 V1300 M780,0 V1300"/>
  </g>

  <!-- credential card + reader + mobile/wearable -->
  <g transform="translate(240,180)">
    <rect width="200" height="126" rx="14" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.2)" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="none" stroke="#ff4b4b" stroke-width="2.5"/>
    <rect x="24" y="80" width="152" height="10" rx="5" fill="rgba(255,255,255,.2)"/>
    <text x="100" y="112" text-anchor="middle" fill="rgba(255,255,255,.35)" font-family="Arial, sans-serif" font-size="11">SEOS CREDENTIAL</text>
  </g>
  <g stroke="#ff4b4b" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.7">
    <path d="M440,240 L560,240"/>
  </g>
  <g transform="translate(570,150)" font-family="Arial, sans-serif">
    <rect width="150" height="220" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <circle cx="75" cy="90" r="40" fill="none" stroke="#ff4b4b" stroke-width="3"/>
    <circle cx="75" cy="90" r="14" fill="#ff1717"/>
    <text x="75" y="180" text-anchor="middle" fill="rgba(255,255,255,.5)" font-size="13">HID Signo</text>
  </g>
  <g stroke="#ff4b4b" stroke-width="2" fill="none" stroke-dasharray="2 8" opacity="0.7">
    <path d="M645,370 L645,470"/>
  </g>
  <g transform="translate(545,480)" font-family="Arial, sans-serif">
    <rect width="200" height="70" rx="35" fill="rgba(255,23,23,.1)" stroke="#ff4b4b" stroke-width="2"/>
    <text x="100" y="45" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="14">Mobile + Wearable</text>
  </g>

  <!-- lower stats panel -->
  <g transform="translate(150,650)" font-family="Arial, sans-serif">
    <rect width="600" height="330" rx="20" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <text x="40" y="58" fill="rgba(255,255,255,.85)" font-size="24" font-weight="800">Credential technology, behind global identity.</text>
    <g stroke="rgba(255,255,255,.14)" stroke-width="1"><path d="M40,88 H560"/></g>
    <g fill="rgba(255,255,255,.85)" font-size="26" font-weight="900">
